# Publishes @charlietogolden/charlie-ui to npm when a v* tag is pushed.
#
# Usage:
#   1. Bump "version" in package.json (e.g. 0.1.0 → 0.1.1).
#   2. Commit on main: `git commit -am "release: v0.1.1"`.
#   3. Tag + push:    `git tag v0.1.1 && git push origin main --tags`.
#   4. This workflow builds + publishes + creates a GitHub Release.
#
# Required repo secret: NPM_TOKEN  (an npm "Automation" token with publish
# rights on the @charlietogolden scope). Generate at npmjs.com → Access
# Tokens → Generate New Token → Granular → scope @charlietogolden → Read
# and Publish.
#
# Provenance (publishConfig.provenance=true) requires id-token: write — npm
# records the GitHub Actions build that produced the tarball.

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (must already exist, e.g. v0.1.1)'
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build & Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write     # create GitHub Release
      id-token: write     # npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Verify tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "Releasing version $PKG"

      - run: npm ci

      - run: npm run build

      - name: Publish to npm (with provenance)
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
